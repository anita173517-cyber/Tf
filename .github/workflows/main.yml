name: RAM PLAYER v19.0 AMOLED 3D - Build & Verify APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Verify project resources & run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK and install SDK 34
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Run offline project & resource verification script
        run: |
          python3 scripts/verify_project.py

      - name: Run unit tests (M3uParserTest)
        run: ./gradlew testDebugUnitTest --info

      - name: Build Debug & Release Signed APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAM-PLAYER-Debug-v19.0
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK (Recommended for 512MB RAM Android TV)
        uses: actions/upload-artifact@v4
        with:
          name: RAM-PLAYER-Release-v19.0-Signed
          path: app/build/outputs/apk/release/*.apk
          
